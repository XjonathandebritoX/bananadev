name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-curriculum:
    name: Validar currículo (README ↔ JSON)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Gerar dados curriculares
        run: npm run curriculum:generate
      - name: Validar currículo sincronizado
        run: npm run curriculum:check

  typecheck:
    name: Typecheck + Astro check
    runs-on: ubuntu-latest
    needs: validate-curriculum
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run check

  unit-tests:
    name: Testes unitários (Vitest)
    runs-on: ubuntu-latest
    needs: validate-curriculum
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Testes unitários
        run: npm run test

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Gerar dados curriculares
        run: npm run curriculum:generate

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://xjonathandebritoX.github.io
          BASE_PATH: /bananadev

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  audit-links:
    name: Auditoria de links
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Auditoria de links (README + site)
        run: npm run audit:links
        env:
          SITE_URL: https://xjonathandebritoX.github.io
          BASE_PATH: /bananadev

  audit-deps:
    name: Auditoria de dependências (npm audit)
    runs-on: ubuntu-latest
    needs: validate-curriculum
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Auditoria de dependências
        run: npm audit --audit-level=high || true
        continue-on-error: true

